case'system':return `<div class="brandband"><h2>Recognisably PROMUNCH.</h2><p>A strong wordmark and confident type. Calm surfaces for the work that matters.</p></div><div class="component-grid">${panel('Brand colours',`<div class="swatches">${[['#AF272F','Brand red'],['#F4F1EA','Canvas'],['#FFFFFF','Surface'],['#1A1714','Ink']].map(([c,l])=>`<div class="swatch"><i style="background:${c}"></i><span>${l}<br>${c}</span></div>`).join('')}</div>`)}${panel('Typography','<h3 style="font-family:Geist;font-size:23px">A clear next step.</h3><p>Assistant makes everyday reading comfortable. Geist adds the brand’s confident voice to page titles.</p><span class="muted">16px body · 14px labels · 24–28px titles</span>')}${panel('Actions',`<div class="stack">${act('Primary action')}${act('Secondary action','')}${act('Text action','textbtn')}</div><p class="small">One primary action for each task.</p>`)}${panel('Status',`<div class="stack">${badge('Delivered','green')}${badge('Pending','amber')}${badge('Failed','red')}${badge('Assigned','blue')}</div><p class="small">Status always has a label. Red buttons are actions, red status labels indicate a problem.</p>`)}${panel('Forms',`<div class="field"><label for="example">Contact name</label><input id="example" value="Riya Shah"><div class="help">A visible label and helpful supporting text.</div></div>`)}${panel('Shared layouts',`${go('S019','Table → mobile records','textbtn')}<br>${go('S028','Inbox → focused conversation','textbtn')}<br>${go('S045','Editor → staged phone form','textbtn')}<br>${go('S074','Record → next action','textbtn')}`)}</div>`;
case'home':return panel('Needs attention',tasks())+metrics([['Shopify sales','₹3,10,000','Last 30 days'],['Amazon gross sales','₹1,24,800','Last 30 days'],['Orders','932','Selected period'],['Needs a reply','8','Right now']])+`<div class="grid">${panel('Reports',`<p>Go deeper when you need to.</p>${go('S015','Sales performance →','textbtn')}<br>${go('S065','WhatsApp performance →','textbtn')}`)}${panel('Connections',`<p>${badge('1 check needed','amber')}</p><p>Email verification needs a current check.</p>${go('S016','View channel health →','textbtn')}`)}</div>`;
case'tasks':return `<div class="toolbar">${go(s.id,'All tasks','soft')}<button data-filter>Assigned to me</button><button data-filter>Unassigned</button></div>`+panel(s.parent==='S084'?'This week':'Open work',tasks(s.parent==='S084'));
case'amazon':return amztabs(s)+`<div class="toolbar periodtoolbar"><label class="muted" for="period">Period</label><select id="period" class="search" style="flex:0 1 220px"><option>Last 30 days</option><option>Last 7 days</option></select>${go('S026','Synced 8 min ago','textbtn')}</div>`+metrics([['Gross sales','₹1,24,800','Finance events'],['Amazon fees','₹37,440','30% of gross'],['Net payout','₹87,360','Before landed costs'],['Products at risk','2','Current inventory']])+`<div class="alert"><div class="grow"><strong>Masala Mania is out of FBA stock</strong><br>120 units inbound. Check the replenishment plan.</div>${go('S019','Review inventory')}</div><div class="grid">${panel('Payout breakdown',kv('Gross sales','₹1,24,800')+kv('Fees & adjustments','−₹37,440')+kv('Net payout','₹87,360')+'<p class="small">Payout is before product costs and other operating expenses.</p>')}${panel('Want the detail?',`<p>Open one work area at a time.</p>${go('S020','SKU economics →','textbtn')}<br>${go('S023','Settlement history →','textbtn')}<br>${go('S025','Recent orders →','textbtn')}`)}</div>`;
case'table':return (s.module==='Amazon'?amztabs(s):'')+table(s);
case'sku':return `<div class="stack" style="margin-bottom:20px">${badge('Out of stock','red')}<span class="muted">SKU PM-ED-MM-100 · FBA</span></div>`+metrics([['Available','0','Current stock'],['Inbound','120','Units'],['Units sold','312','Last 90 days'],['Contribution/unit','₹34','After known costs']])+`<div class="grid">${panel('Per-unit breakdown',kv('Average sales price','₹110')+kv('Amazon fees','−₹34')+kv('Net payout / unit','₹76')+kv('Landed cost / unit','−₹42')+kv('Contribution / unit','₹34'))}${panel('Stock context',kv('Sales velocity','3.4 units / day')+kv('Days of cover','0')+kv('Inbound units','120')+'<p class="small">Lost-sales estimates depend on recent demand and may not reflect sales recovered through other fulfilment.</p>')}</div>`;
case'settlement':return metrics([['Gross sales','₹1,24,800','1–14 Sep'],['Fees','₹37,440','Same settlement'],['Net payout','₹87,360','Reported by Amazon'],['Reconciliation','Review','No bank match implied']])+panel('Settlement breakdown',kv('Settlement reference','SAMPLE-SEP-01')+kv('Period','1–14 Sep 2026')+kv('Gross sales','₹1,24,800')+kv('Fees & adjustments','−₹37,440')+kv('Net payout','₹87,360'));
case'campaign':return metrics([['Recipients','180','Eligible audience'],['Delivered','175','Of 180 sent'],['Replies','18','Unique contacts'],['Revenue','₹12,000','Attributed orders']])+panel('Campaign status',kv('Status',s.parent==='S117'?'Draft':'Completed')+kv('Channel',s.parent==='S117'?'Email':'WhatsApp')+kv('Scheduled','18 Sep, 11:00 am IST')+kv('Audience','Eligible subscribers')+'<div class="stack">'+go(s.parent==='S117'?'S115':'S043','Edit campaign')+go(s.parent==='S117'?'S117-1':'S042-1',s.parent==='S117'?'Pause campaign':'Recipient log')+'</div>')+panel('Content',previewMessage(s));
case'form':return `<form class="form panel" data-demo-form>${fields(s)}${footer(s)}</form>`;
case'auth':return `<div class="auth"><div class="authcard"><img src="${LOGO}" alt="PROMUNCH"><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p><form data-demo-form>${fields(s)}${s.next?go(s.next,esc(s.action),'primary'):act(s.action)}</form><div class="authlinks">${go('S001','Sign in','textbtn')}${go('S003','Use email link','textbtn')}${go('S002','Create account','textbtn')}</div><div class="small muted" style="margin-top:16px">Approved work accounts only.</div></div></div>`;
case'inbox':return `<div class="toolbar"><button class="soft" data-filter>Needs reply</button><button data-filter>All</button><button data-filter>Mine</button><button data-filter>Unassigned</button></div>`+inbox(s);
case'chat':return `${go(s.parent==='S079'?'S078':'S027','← Back to inbox','textbtn')}<div style="margin:10px 0">${badge('Reply window open','green')} ${badge('Human','blue')}</div>`+inbox(s);
case'restricted':return `<div class="alert"><div><strong>${s.variant==='Window closed'?'Use an approved template':s.variant==='Send failed'?'Delivery failed':'Contact opted out'}</strong><p>${esc(s.sub)}</p></div></div>`+panel('Recent conversation',`<div class="bubble">${s.variant==='Main view'?'STOP':'Could you share the details?'}<div class="msgtime">Last received message</div></div><label class="small" for="blocked">Reply</label><textarea id="blocked" disabled style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font:inherit" placeholder="${s.variant==='Main view'?'Messaging unavailable for this contact':'Review available messaging options'}"></textarea>${go(s.next||'S029',esc(s.action),'primary')}`);
case'customer':return `<div class="stack" style="margin-bottom:22px">${badge('Loyal customer','blue')}${badge('Email subscribed','green')}${badge('WhatsApp eligible','green')}</div><div class="grid">${panel('Contact',kv('Name','Riya Shah')+kv('Phone','+91 90000 00001')+kv('Email','riya@example.com')+go('S111','Audience & properties →','textbtn'))}${panel('Orders',kv('Orders','4')+kv('Lifetime value','₹2,400')+kv('Last purchase','10 Sep 2026')+go('S110','View order history →','textbtn'))}</div>`+panel('Latest activity',`<div class="task"><div class="grow"><strong>Order #1048</strong><p>₹600 · Customer confirmation needed</p></div>${go('S074','View order','textbtn')}</div><div class="task"><div class="grow"><strong>WhatsApp conversation</strong><p>Delivery question · Today</p></div>${go('S028','Open chat','textbtn')}</div>`);
case'templatepick':return panel('Approved templates',[['Order confirmation','Utility · English'],['Shipping update','Utility · English'],['Product information','Utility · English']].map(x=>`<div class="task"><div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${go('S033-1','Choose','textbtn')}</div>`).join(''));
case'template':return stepbar(/S045|S093/.test(s.parent)?2:1)+`<div class="split"><form class="panel" data-demo-form>${fields(s)}${footer(s)}</form><div>${panel('Customer preview',previewMessage(s)+'<p class="small">Variable examples are for review. Verify the actual recipient preview before sending.</p>')}</div></div>`;
case'review':{let count=s.parent==='S073'?'3':s.parent==='S095'?'18':'180';return stepbar(3)+`<div class="grid">${panel('What will happen',kv('Audience',s.parent==='S073'?'Eligible missing notifications':s.parent==='S095'?'Corporate gifting list':'Engaged customers')+kv('Recipients',count)+kv('Excluded','Opted out, duplicate or ineligible')+kv('Timing',s.parent==='S073'?'After confirmation':'18 Sep, 11:00 am IST')+kv('Repeat','Never')+'<p class="small">Review eligibility again at execution. Preview actions never send a message.</p>')}${panel('Content preview',s.parent==='S095'?'<p>Hi Priya, I am Parth, founder of PROMUNCH. Would you like to explore our snacks for your gifting programme?</p><p class="small">Parth · parth@trypromunch.in</p>':previewMessage(s))}</div>`+panel('Final check',`<label class="stack"><input type="checkbox" style="width:20px;height:20px"> I have checked the audience, content and timing.</label>${footer(s)}`)}
case'audience':return stepbar(1)+metrics([['Available contacts','420','Selected list'],['Eligible','180','Current rules'],['Excluded','240','Consent or eligibility'],['Selected','180','Review before launch']])+panel('Choose an audience',`<div class="field"><label for="audience">Audience</label><select id="audience"><option>Engaged and eligible contacts</option><option>Eligible repeat customers</option><option>By segment</option><option>By tags</option></select></div>${kv('Marketing consent','Required')}${kv('Suppressed contacts','Excluded')}${kv('Already contacted / enrolled','Excluded where applicable')}<details><summary>Why contacts are excluded</summary><p>Imported phone numbers alone do not establish marketing eligibility. Existing consent, suppression and duplicate protection rules still apply.</p></details>${footer(s)}`);
case'import':return `<div class="split"><div class="panel"><h2>1. Choose a file</h2><div class="dropzone"><p>${s.parent==='S129'?'PNG or SVG wordmark':s.parent==='S064'?'Approved source document':'CSV with column headers'}</p><input type="file" aria-label="Choose a sample file"><p class="small">File stays in this design preview.</p></div><h2>2. Match columns</h2>${fields(s)}</div>${panel('3. Review before importing',kv('Valid sample rows','18')+kv('Need correction','2')+kv('Duplicates','0')+'<p>No marketing consent is added just because a contact is imported.</p>'+footer(s))}</div>`;
case'media':return panel('Attachment',`<div class="dropzone"><svg viewBox="0 0 320 160" aria-label="Sample attachment"><rect width="320" height="160" rx="12" fill="#f4f1ea"/><rect x="120" y="20" width="80" height="120" rx="8" fill="#af272f"/><text x="160" y="73" fill="white" text-anchor="middle" font-size="12">PROMUNCH</text><text x="160" y="100" fill="white" text-anchor="middle" font-size="10">Sample image</text></svg><p class="small">product-information.png · 240 KB</p><input type="file" aria-label="Choose attachment"></div>${fields(s)}${footer(s)}`);

case'health':return panel('Data sources',(s.parent==='S060'?[['Voice calls','Some records need review','Review','amber'],['Contact do-not-call flags','Partial update failure','Review','red']]:s.parent==='S026'?[['Orders','Last success 8 min ago','Current','green'],['Inventory','Last success 12 min ago','Current','green'],['Finance','Last success yesterday','Review freshness','amber']]:[['WhatsApp','Last message 2 min ago','Connected','green'],['Shopify','Last sync 8 min ago','Connected','green'],['Amazon','Inventory checked 12 min ago','Connected','green'],['Email','No current verification available','Unverified','amber']]).map(x=>`<div class="statusline"><div><strong>${x[0]}</strong><div class="small muted">${x[1]}</div></div>${badge(x[2],x[3])}</div>`).join('')+`<details><summary>Technical details</summary><p class="small">Per-source last successful activity, error details and configuration state belong here. Never infer healthy from the presence of old data.</p></details>`);
case'library':{let mail=/S118|S119/.test(s.parent),custom=s.id==='S057-1';let entries=mail?[['Welcome series','New subscriber','S120'],['Abandoned cart','Abandoned checkout','S120'],['Post-purchase','Order completed','S120']]:custom?[['Post-purchase follow-up','Order placed','S057-2']]:[['Order confirmation','Order placed','S050'],['COD confirmation','COD order placed','S051'],['Shipping update','Order fulfilled','S052'],['Abandoned-cart recovery','Checkout abandoned','S053'],['Voice rescue','Recovery eligibility','S054'],['Review request','Post-purchase delay','S055'],['Restock reminder','Purchase interval','S056']];return panel('Journeys',entries.map(([a,b,c])=>`<div class="task"><div class="grow"><strong>${a}</strong><p>${b}</p></div>${badge(mail?'Draft':'Active',mail?'amber':'green')}${go(c,'Open →','textbtn')}</div>`).join(''))}
case'flow':return `<div class="grid"><form class="panel" data-demo-form><h2>Configuration</h2>${fields(s)}${footer(s)}</form>${panel('Journey steps',[['Trigger',s.parent==='S053'?'Customer abandons checkout':'Order placed'],['Wait','After the selected delay'],['Message',s.title],['Stop conditions','Customer responds, orders or becomes ineligible according to this journey']].map((x,i)=>`<div class="step"><span class="n">${i+1}</span><div><h3>${x[0]}</h3><p>${esc(x[1])}</p>${i===2?go('S033','Preview template','textbtn'):''}</div></div>`).join(''))}</div>`;
case'call':return `<div class="stack" style="margin-bottom:20px">${badge('Connected','green')}${badge('Asked for link','blue')}</div>`+panel('Recording',`<div class="stack"><button data-audio aria-label="Play sample recording">▶ Play sample</button><input aria-label="Recording position" type="range" min="0" max="102" value="0" style="flex:1;min-width:100px"><span class="small">0:00 / 1:42</span></div><p class="small">Illustrative player. No customer recording is loaded.</p>`)+panel('Transcript',`<div class="bubble"><strong>Customer</strong><p>Could you send me the link?</p></div><div class="bubble out"><strong>Agent</strong><p>I can help with the next step.</p></div><div class="small muted">Illustrative transcript for layout review.</div>`)+panel('Related activity',kv('Cart','₹600')+kv('Order','Not yet linked')+kv('Do-not-call','No')+go('S029','View customer →','textbtn'));
case'growth':return `<div class="split"><form class="panel" data-demo-form>${fields(s)}<details><summary>Display and placement</summary><div class="field"><label for="position">Position</label><select id="position"><option>Bottom right</option><option>Bottom left</option><option>Centre</option></select></div></details>${footer(s)}</form>${panel('Customer preview',`<div class="phonecustomer"><div class="popup"><img src="${LOGO}" alt="PROMUNCH"><h3>${s.parent==='S062'?'How can we help?':'Meet your next favourite snack'}</h3><p>${s.parent==='S062'?'Start a conversation with our team.':'Get PROMUNCH updates on WhatsApp.'}</p><button class="primary" data-action="Customer preview only">${s.parent==='S062'?'Chat with PROMUNCH':'Keep me updated'}</button></div></div><p class="small">Save controls the design. Installation is a separate action.</p>`)}</div>`;
case'knowledge':return `<form class="form panel" data-demo-form>${fields(s)}<div class="stack">${go('S064-1','Upload a document instead','textbtn')}</div>${footer(s)}</form>`;
case'report':{let wa=/S065|S066/.test(s.parent),email=/S121/.test(s.parent),outreach=s.parent==='S101';return `<div class="toolbar"><label for="range" class="muted">Period</label><select id="range" class="search" style="max-width:220px"><option>Last 30 days</option><option>Last 7 days</option><option>Last 90 days</option></select><span class="small muted">Values below are sample data</span></div>`+metrics(wa?[['Messages sent','420'],['Delivered','94%','395 / 420 messages'],['Replies','56','Unique replying contacts'],['Attributed sales','₹62,000','Attribution basis required']]:email||outreach?[['Emails sent','180'],['Delivered','97%','175 / 180 messages'],['Replies','18'],['Attributed revenue','₹12,000']]:[['Revenue','₹3,10,000'],['Orders','620'],['Average order','₹500'],['Tracked orders','90%']])+chart(wa?'Messages delivered':email||outreach?'Sending activity':'Sales by day')+panel('Read the breakdown',`${go(wa?'S066':email?'S117':outreach?'S096':'S076',wa?'Campaign results →':email?'Campaign performance →':outreach?'Sequence performance →':'Sales by channel →','textbtn')}<p class="small">Figures use the selected reporting period. Open a breakdown to see the underlying records.</p>`)}
case'email':return panel(s.id==='S115-1'?'Customer email preview':'Incoming email',`<div class="small muted">${s.id==='S115-1'?'PROMUNCH · hello@trypromunch.in':'Riya Shah · riya@example.com'}</div><hr style="border:0;border-top:1px solid #e5e0d6;margin:20px 0"><p style="color:#1a1714;line-height:1.7">${s.id==='S115-1'?'Discover PROMUNCH favourites and find your next snack.':'Hi team,<br><br>Could you share the latest update for my order #1048? I would appreciate your help.<br><br>Thanks,<br>Riya'}</p>`)+panel('Next step',`${go(s.id==='S115-1'?'S115':'S069',s.id==='S115-1'?'Back to editor':'Review drafted reply','primary')}${go('S071','Sender context','textbtn')}`);
case'emaildraft':return `<form class="form panel" data-demo-form><div class="eyebrow">${s.parent==='S094'?'Personalized preview':'Editable draft'}</div>${fields(s)}<details><summary>Source and earlier revisions</summary><p class="small">Use the approved source information and preserve earlier draft revisions. This sample text is for layout review.</p></details>${footer(s)}</form>`;
case'history':return panel('Activity',`<div class="timeline">${(s.parent==='S131'?[['12 Sep, 11:40 am','Access updated','Actor: Workspace owner. Target: Team member.'],['Recorded metadata','Member access','Previous access: Member. New access: Admin.']]:s.parent==='S070'?[['Today, 10:44 am','Reply sent','The latest sent message, distinct from draft content.'],['Today, 10:43 am','Draft revised','Earlier revision retained for reference.']]:[['Today, 10:42 am','Customer sent a message','Question about order #1048.'],['10 Sep, 2:12 pm','Order #1048 placed','₹600 · COD confirmation required.'],['8 Sep, 11:30 am','Email delivered','Campaign: Weekly favourites.']]).map(x=>`<div class="event"><span class="small muted">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><details><summary class="small">View details</summary><p>${x[2]} Only recorded information is displayed.</p></details></div>`).join('')}</div>`);
case'order':return `<div class="stack" style="margin-bottom:20px">${badge('Notification delivered','green')}${badge('Customer confirmation needed','amber')}</div><div class="grid">${panel('Order details',kv('Customer','Riya Shah')+kv('Amount','₹600')+kv('Payment','Cash on delivery')+kv('Order placed','12 Sep, 10:20 am'))}${panel('Next action','<p>Check the customer response before confirming this COD order.</p>'+go('S074-1','Record customer confirmation','primary')+'<br>'+go('S028','Open conversation →','textbtn')+'<br>'+go('S074-2','Review cancellation action','textbtn'))}</div>`;
case'board':return `<div class="toolbar"><input class="search" aria-label="Search pipeline" placeholder="Search company or creator…">${go(s.parent==='S103'?'S103-1':'S084','List view')}<button data-filter>Follow-up due</button></div><div class="board">${['New inquiries','In conversation','Proposal'].map((t,i)=>`<section class="column"><h2>${t} <span class="muted">${i===0?'2':'1'}</span></h2>${[i===0?'City Hotel Group':i===1?'Bright Gifts':'Green Desk Co.',...(i===0?['North Hub']:[])].map(n=>`<button class="dealcard" data-go="${s.parent==='S080'?'S084-1':'S104'}"><strong>${s.parent==='S080'?'Ananya':n}</strong><p>${s.parent==='S080'?'Creator collaboration':'Corporate gifting'}</p><p><b>Next:</b> Share product information</p>${badge('Due 15 Sep','amber')}</button>`).join('')}</section>`).join('')}</div>`;

case'keys':return panel('Service keys',[['OpenAI','Configured'],['Resend','Configured'],['Shopify','Configured']].map(x=>`<div class="statusline"><div><strong>${x[0]}</strong><div class="small muted">•••••••• · Value hidden</div></div>${go('S127-1','Rotate','textbtn')}</div>`).join('')+'<p class="small">Owner access required. Secrets remain masked.</p>');
case'brand':return `<div class="grid">${panel('Current wordmark',`<div class="dropzone"><img src="${LOGO}" alt="PROMUNCH current wordmark" style="width:240px"><p class="small">Keep original proportions. Do not crop.</p>${go('S129-1','Upload logo')}</div><div class="stack"><span style="height:40px;width:40px;background:#af272f;border-radius:6px"></span><span>Primary accent · #AF272F</span></div>`)}<form class="panel" data-demo-form>${fields(s)}${footer(s)}</form></div>`;
case'progress':return panel('Progress',[['Find companies','25 of 25 found'],['Find contact details','18 verified · 7 being checked'],['Prepare results','Will be ready after the current stage']].map((x,i)=>`<div class="step"><span class="n">${i<1?'✓':i+1}</span><div style="flex:1"><h3>${x[0]}</h3><p>${x[1]}</p><div class="ratio"><span style="width:${i===0?100:i===1?72:0}%"></span></div></div></div>`).join(''));
case'confirm':return `<div class="panel form"><p>${esc(s.sub)}</p>${fields(s)}<div class="alert"><strong>This is a design preview. Confirming does not change any live record.</strong></div><div class="formfoot">${go(s.parent,'Cancel')}${act(s.action,'primary')}</div></div>`;
case'loading':return `<div class="panel" aria-busy="true"><span class="muted">Loading…</span>${[90,70,85,60,90].map(w=>`<div class="line" style="width:${w}%"></div>`).join('')}</div>`;
case'state':return panel('',`<div class="blank"><div style="font-size:28px;color:#af272f">${/saved|unsubscribed|complete|sent|scheduled/i.test(s.title)?'✓':'○'}</div><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p>${s.next?go(s.next,esc(s.action),'primary'):act(s.action)}</div>`);
case'navigation':return `<div class="grid">${[['Daily work',[['S013','Home'],['S027','WhatsApp'],['S067','Support email'],['S072','Order confirmations']]],['Sales & CRM',[['S018','Amazon'],['S075','Shopify'],['S106','Contacts'],['S086','B2B leads'],['S103','Deals']]],['Marketing & tools',[['S113','Email campaigns'],['S041','WhatsApp campaigns'],['S049','Automations'],['S061','Growth tools'],['S122','Ask Maya']]],['Administration',[['S125','Connections'],['S063','Knowledge base'],['S130','Team'],['S127','API keys'],['S129','Brand'],['S131','Audit log']]]].map(([t,links])=>panel(t,links.map(([id,l])=>go(id,l+' →','textbtn')+'<br>').join(''))).join('')}</div>`;
case'help':return panel('Choose a task',[['S027','Reply to a customer'],['S019','Check Amazon stock'],['S073','Review missing order notifications'],['S044','Prepare a WhatsApp campaign'],['S130','Invite a teammate']].map(([id,l])=>`<div class="task"><strong class="grow">${l}</strong>${go(id,'Show me','textbtn')}</div>`).join(''));
default:throw Error('Unmapped composition '+s.kind)
}}

const disclosure=(title,body)=>`<details class="panel disclosure"><summary>${title}<span class="muted">View details</span></summary><div class="disclosurebody">${body}</div></details>`;
function stockRows(){return [['Masala Mania · 100g','PM-MM-100',0,0,120,'Out of stock','red'],['Peri Peri · 100g','PM-PP-100',18,6,0,'Restock soon','amber'],['Classic Salted · 100g','PM-CS-100',162,36,60,'Stocked','green']].map(([name,sku,units,days,inbound,status,t])=>`<div class="stockrow"><div class="stockname"><strong>${name}</strong><span class="small muted">${sku}</span></div><div class="stockcover"><div class="minirow">${badge(status,t)}<b>${days} days</b></div><div class="covertrack ${t}" role="img" aria-label="${name}: ${days} estimated days of stock, reference 28 days"><i style="width:${Math.min(100,days/28*100)}%"></i></div></div><div class="stockqty"><b>${units}</b><span class="muted">Available</span></div><div class="stockqty"><b>${inbound}</b><span class="muted">Inbound</span></div>${go('S021','Details','textbtn')}</div>`).join('')}
function financeBars(){return `<div class="moneyline"><div>Gross sales <b>₹1,24,800</b></div><i style="width:100%;background:#af272f"></i></div><div class="moneyline"><div>Amazon fees <b>₹37,440</b></div><i style="width:30%;background:#bb8a2c"></i></div><div class="moneyline"><div>Net payout <b>₹87,360</b></div><i style="width:70%;background:#3f6b4f"></i></div><p class="small muted">Before product costs. This sample has no other adjustments.</p>`}
function content(s){
 if(s.kind==='amazon')return `<div class="toolbar"><span class="muted">Sales period</span><select aria-label="Sales period"><option>Last 30 days</option></select>${go('S026','Sync status','textbtn')}</div>`+metrics([['Gross sales','₹1,24,800','Last 30 days'],['Amazon fees','30%','₹37,440 in the same period'],['Net payout','₹87,360','Before product costs'],['Stock needs attention','2 SKUs','Current FBA inventory']])+panel('FBA stock cover',`<div class="stockheading"><span>${badge('1 out of stock','red')} ${badge('1 running low','amber')}</span><span class="small muted">Estimated days until stock runs out</span></div>${stockRows()}<p class="small muted">Bars use a 28-day reference. Restock soon: 14 days or less. Inbound stock is separate from available stock.</p><details><summary>How stock cover is calculated</summary><p>Available units ÷ recent units sold per day. Use the last 30 days, with a labelled 90-day fallback. Without sales history, show “No demand estimate”. Missing inventory is “Unavailable”, not zero. Stock that is already at zero stays visible even without sales history.</p></details>`)+disclosure('SKU economics',table({...SCREENS.find(x=>x.id==='S020')}))+disclosure('Payout breakdown',financeBars())+disclosure('Settlements',table({...SCREENS.find(x=>x.id==='S023')}))+disclosure('Recent orders',table({...SCREENS.find(x=>x.id==='S025')}));
 if(s.id==='S019')return amztabs(s)+panel('FBA stock cover',stockRows()+'<p class="small muted">Reference: 28 days. Inbound units are not yet available to sell.</p>');
 if(s.kind==='home')return `<div class="toolbar"><label for="homeperiod" class="muted">Period</label><select id="homeperiod"><option>Last 30 days</option></select></div>`+metrics([['Shopify sales','₹3,10,000','Last 30 days'],['Amazon gross sales','₹1,24,800','Last 30 days'],['Shopify orders','620','Last 30 days'],['Customers','482','Selected period']])+panel('Needs attention',tasks())+`<div class="grid">${panel('Sales by channel',`<div class="moneyline"><div>Shopify <b>₹3,10,000</b></div><i style="width:100%;background:#af272f"></i></div><div class="moneyline"><div>Amazon <b>₹1,24,800</b></div><i style="width:40.26%;background:#3c6e72"></i></div><p class="small muted">Same 30-day period. Creator seed orders excluded.</p>`)}${panel('Customer operations',kv('WhatsApp awaiting reply',go('S027','8 conversations','textbtn'))+kv('Pending support emails',go('S067','3 emails','textbtn'))+kv('Order notifications missing',go('S073','2 orders','textbtn')))}</div>`+disclosure('Channel health and delivery detail',go('S016','View channel health','textbtn'));
 if(s.kind==='system')return panel('PROMUNCH colours',`<div class="swatches">${[['#AF272F','Brand red'],['#F4F1EA','Canvas'],['#FFFFFF','Card'],['#1A1714','Text']].map(([c,l])=>'<div class="swatch"><i style="background:'+c+'"></i>'+l+'</div>').join('')}</div><p>Keep Geist and the current title, metric and body sizes. Use red for navigation and primary actions; use labelled green, amber and red for status.</p>`)+metrics([['Metric label','₹1,24,800','Clear period or definition'],['Out of stock','1 SKU','Current inventory']])+panel('Stock cover',stockRows())+disclosure('Secondary information','Detailed records stay accessible, with a clear summary visible before expanding.');
 if(s.kind==='navigation')return currentNav.map(([g,links])=>panel(g||'Overview',links.map(([id,l])=>go(id,l,'textbtn')+'<br>').join(''))).join('');
 let result=originalContent(s);
 if(s.kind==='report')result=result.replace('Attribution basis required','Orders matched by customer phone');
 return result;
}
function moduleTabs(s){
 let n=Number(s.parent.slice(1)),links=[];
 if(n>=27&&n<=66){links=[['S027','Inbox'],['S030','Tickets'],['S038','Templates'],['S041','Campaigns'],['S049','Flows'],['S058','Voice'],['S061','Growth'],['S065','Analytics'],['S063','Knowledge']];}
 else if(n>=78&&n<=85)links=[['S078','Inbox'],['S080','Collabs'],['S082','Discovery'],['S084','Tasks'],['S078-1','Needs human'],['S078-2','Spam'],['S085','Settings']];
 else if(n>=86&&n<=102)links=[['S086','Lists'],['S096','Sequences'],['S098','Templates'],['S100','Replies'],['S101','Analytics'],['S102','Settings']];
 else if(n>=125&&n<=130)links=[['S125','Connections'],['S127','API keys'],['S128','Email'],['S129','Brand'],['S130','Team']];
 links=links.filter(([id])=>SCREENS.some(x=>x.id===id));
 return links.length?'<nav class="tabs moduletabs" aria-label="Module sections">'+links.map(([id,label])=>go(id,label,s.parent===id?'active':'')).join('')+'</nav>':'';
}
const currentNav=[['',[['S013','Dashboard'],['S122','Ask Maya']]],['Inbox',[['S067','Support Emails'],['S027','WhatsApp'],['S078','Instagram']]],['Sales',[['S072','Order Confirmations'],['S075','Shopify'],['S018','Amazon'],['S086','B2B Leads'],['S103','Deals']]],['Audience',[['S106','Contacts'],['S113','Campaigns'],['S118','Flows'],['S121','Analytics']]],['System',[['S125','Settings'],['S131','Audit Log'],['S008','Help & tour']]]];
function navLinks(s){let n=+s.parent.slice(1),active=n>=18&&n<=26?'S018':n>=27&&n<=66?'S027':n>=67&&n<=71?'S067':n>=72&&n<=74?'S072':n>=75&&n<=77?'S075':n>=78&&n<=85?'S078':n>=86&&n<=102?'S086':n>=103&&n<=105?'S103':n>=106&&n<=112?'S106':n>=113&&n<=117?'S113':n>=118&&n<=120?'S118':n>=125&&n<=130?'S125':s.parent;return currentNav.map(([group,links])=>(group?'<div class="groupname">'+group+'</div>':'')+links.map(([id,label])=>go(id,label,active===id?'active':'')).join('')).join('')}
function app(s,state='Ready'){
 let body=state==='Ready'?content(s):state==='Loading'?originalContent({...s,kind:'loading'}):panel('',`<div class="blank"><h2>${state==='Empty'?'No matching records':state==='Error'?'We could not load this view':'Access restricted'}</h2><p>${state==='Empty'?'Clear the filters or return to the list.':state==='Error'?'Try again to see current information. Unavailable data is not shown as zero.':'Ask your workspace administrator for access.'}</p><button class="primary" data-reset>${state==='Empty'?'Clear filters':'Try again'}</button></div>`);
 if(['S001','S002','S003','S004','S005','S011'].includes(s.parent))return s.kind==='auth'&&state==='Ready'?body:'<div class="auth"><div class="authcard">'+body+'</div></div>';
 return `<div class="app"><aside class="sidenav"><div class="logoplate"><img src="${LOGO}" alt="PROMUNCH"></div>${navLinks(s)}<div class="account">PROMUNCH team<br>${go('S006','Account','textbtn')}</div></aside><div class="content"><header class="topline"><button data-menu aria-label="Open navigation">☰</button><img src="${LOGO}" alt="PROMUNCH"><span>Workspace</span></header><main class="page"><div class="head"><div><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></div>${!['chat','form','auth','confirm','state','loading','template','emaildraft','review','import','flow','knowledge'].includes(s.kind)?'<div class="headact">'+(s.next?go(s.next,esc(s.action),'primary'):act(s.action))+'</div>':''}</div>${moduleTabs(s)}${body}</main></div></div>`;
}

const INNER_SCRIPT=`document.addEventListener('click',e=>{if(e.target.closest('[data-menu]'))document.querySelector('.app').classList.toggle('menu-open')});document.addEventListener('submit',e=>e.preventDefault());function send(x){parent.postMessage(x,'*')}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.go){send({go:b.dataset.go});return}if(b.hasAttribute('data-reset')){send({reset:true});return}if(b.hasAttribute('data-filter')){const el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modalbox" role="dialog" aria-modal="true" aria-label="Filters"><h2>Filters</h2><div class="field"><label for="filterstatus">Status</label><select id="filterstatus"><option>All</option><option>Ready</option><option>Pending</option><option>Failed</option></select></div><button class="primary" id="applyfilter">Apply filters</button> <button id="closefilter">Cancel</button></div>';document.body.appendChild(el);el.querySelector('select').focus();el.querySelector('#closefilter').onclick=()=>el.remove();el.querySelector('#applyfilter').onclick=()=>{const v=el.querySelector('select').value;document.querySelectorAll('[data-row]').forEach(r=>r.hidden=v!=='All'&&!r.textContent.includes(v));el.remove();toast('Filter applied to sample records.')};return}if(b.hasAttribute('data-audio')){b.textContent=b.textContent.includes('Play')?'❚❚ Pause sample':'▶ Play sample';toast('Illustrative player. No recording is loaded.');return}if(b.dataset.action){const text=b.dataset.action;if(/Send|Launch|Schedule|Remove|Delete|Disconnect|Confirm|Activate|Rotate/i.test(text)){const el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modalbox" role="dialog" aria-modal="true" aria-label="Review action"><h2>'+text.replace(/[<>]/g,'')+'</h2><p>This is a simulated design action. It will not contact anyone or change live data.</p><button class="primary" id="confirmdemo">Confirm preview</button> <button id="canceldemo">Cancel</button></div>';document.body.appendChild(el);el.querySelector('#canceldemo').onclick=()=>el.remove();el.querySelector('#confirmdemo').onclick=()=>{el.remove();toast('Preview confirmed. No live action was taken.')};el.querySelector('#canceldemo').focus()}else{toast(text+' · Preview complete. No live data changed.')}}});function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4000)}document.addEventListener('change',e=>{if(e.target.hasAttribute('data-route'))send({go:e.target.value})});document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'&&document.querySelector('[data-live-preview]')){document.querySelector('[data-live-preview]').textContent=e.target.value.replaceAll('{{1}}','Riya').replaceAll('{{2}}','1048').replaceAll('{{first_name}}','Priya')}if(e.target.classList.contains('search')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-row]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modalback')?.remove()});`;
function render(){const s=SCREENS.find(x=>x.id===selected)||SCREENS[0];selected=s.id;location.hash=selected;$('screenTitle').textContent=s.title;$('screenMeta').textContent=s.module+' · '+s.variant+' · '+s.id;$('designNote').textContent='Refinement proposal with fictional sample data. '+s.plan+' Mobile: '+s.mobile;$('source').textContent='Screen / section: '+s.name+' · '+s.source;$('preview').srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(s.title)+'</title><style>'+APP_CSS+'</style></head><body class="'+(s.kind==='chat'?'focus-chat':s.kind==='amazon'?'amazon-page':'')+'">'+app(s,$('state').value)+'<script>'+INNER_SCRIPT+'<\/script></body></html>';$('approved').checked=!!approved[selected+'-'+device];$('feedback').value=notes[selected+'-'+device]||'';fit();catalog();$('progress').textContent=Object.values(approved).filter(Boolean).length+' of '+SCREENS.length*2+' laptop/mobile layouts approved'}
function fit(){const w=device==='mobile'?390:1240,h=device==='mobile'?844:900;const available=document.querySelector('.stage').clientWidth-(innerWidth<950?24:44),scale=Math.min(1,available/w);$('preview').style.width=w+'px';$('preview').style.height=h+'px';$('preview').style.transform='scale('+scale+')';$('framebox').style.width=w*scale+'px';$('framebox').style.height=h*scale+'px'}
function filtered(){const q=$('find').value.toLowerCase(),m=$('module').value;return SCREENS.filter(s=>(!m||s.module===m)&&(!q||(s.title+' '+s.name+' '+s.variant+' '+s.module).toLowerCase().includes(q)))}
function catalog(){const a=filtered();$('catalog').innerHTML=a.map(s=>`<button class="${s.id===selected?'selected':''}" data-id="${s.id}">${esc(s.title)}<small>${esc(s.variant)} · ${s.id}</small></button>`).join('');$('screenSelect').innerHTML=a.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.title)} · ${esc(s.variant)}</option>`).join('')}
$('count').textContent=SCREENS.length+' page and interaction previews';$('module').innerHTML='<option value="">All areas</option>'+[...new Set(SCREENS.map(s=>s.module))].map(m=>`<option>${esc(m)}</option>`).join('');$('catalog').onclick=e=>{let b=e.target.closest('button');if(b){selected=b.dataset.id;$('state').value='Ready';render()}};$('find').oninput=catalog;$('module').onchange=catalog;$('screenSelect').onchange=e=>{selected=e.target.value;$('state').value='Ready';render()};$('state').onchange=render;['laptop','mobile'].forEach(x=>$(x).onclick=()=>{device=x;['laptop','mobile'].forEach(d=>$(d).classList.toggle('on',x===d));render()});['previous','next'].forEach((id,i)=>$(id).onclick=()=>{let a=filtered(),idx=a.findIndex(s=>s.id===selected);selected=a[(idx+(i?1:-1)+a.length)%a.length]?.id||selected;$('state').value='Ready';render()});$('approved').onchange=e=>{approved[selected+'-'+device]=e.target.checked;try{localStorage.setItem('pm-refinement-v2-approved',JSON.stringify(approved))}catch{}render()};$('feedback').oninput=e=>{notes[selected+'-'+device]=e.target.value;try{localStorage.setItem('pm-refinement-v2-notes',JSON.stringify(notes))}catch{}};$('export').onclick=()=>{const b=new Blob([JSON.stringify({date:new Date().toISOString(),approved,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PROMUNCH-design-feedback.json';a.click();URL.revokeObjectURL(a.href)};addEventListener('message',e=>{if(e.source!==$('preview').contentWindow)return;if(e.data.go&&SCREENS.some(s=>s.id===e.data.go)){selected=e.data.go;$('state').value='Ready';render()}if(e.data.reset){$('state').value='Ready';render()}});addEventListener('resize',fit);window.setPreview=(id,d='laptop',state='Ready')=>{selected=id;device=d;$('state').value=state;render()};render();
</script></body></html>
