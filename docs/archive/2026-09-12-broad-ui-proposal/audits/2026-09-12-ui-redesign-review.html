function fields(s){return s.fields.split('|').filter(Boolean).map((f,i)=>{let j=f.indexOf('='),label=j<0?f:f.slice(0,j),value=j<0?'':f.slice(j+1);let text=/Message|Reply$|Content$|Brief|Instruction|Body|Barter terms/.test(label);let secret=/password|New key/i.test(label);let type=/date/i.test(label)?'date':/time$/i.test(label)?'time':/email/i.test(label)&&!value.includes(' · ')?'email':secret?'password':'text';let choices={Enabled:['On','Off'],Status:['Draft','Active','Paused'],Language:['English','Hindi'],Category:['Utility','Marketing'],Priority:['Normal','High','Urgent'],Repeat:['Never','Daily','Weekly','Monthly'],'Reply mode':['Human','AI'],'Access level':['Member','Admin'],'Search method':['Keyword','Hashtag'],'Assigned to':['You','Unassigned','Team'],'Ticket status':['Open','Pending','Resolved','Closed'],Personalization:['Off','On'],Position:['Bottom right','Bottom left'],'Outreach type':['Single email','Sequence'],'Minimum followers':null};return `<div class="field"><label for="f${i}">${esc(label)}</label>${choices[label]?`<select id="f${i}">${[...new Set([value,...choices[label]].filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:text?`<textarea id="f${i}">${esc(value)}</textarea>`:`<input id="f${i}" type="${type}" value="${esc(value)}" placeholder="${secret?'Enter securely':esc(label)}" ${label==='Work email'?'required':''}>`}${secret?'<div class="help">Preview only. Do not enter a real password or key.</div>':''}</div>`}).join('')}

case'settlement':return metrics([['Gross sales','₹1,24,800','1–14 Sep'],['Fees','₹37,440','Same settlement'],['Net payout','₹87,360','Reported by Amazon'],['Reconciliation','Review','No bank match implied']])+panel('Settlement breakdown',kv('Settlement reference','SAMPLE-SEP-01')+kv('Period','1–14 Sep 2026')+kv('Gross sales','₹1,24,800')+kv('Fees & adjustments','−₹37,440')+kv('Net payout','₹87,360'));
case'campaign':return metrics([['Recipients','180','Eligible audience'],['Delivered','175','Of 180 sent'],['Replies','18','Unique contacts'],['Revenue','₹12,000','Attributed orders']])+panel('Campaign status',kv('Status',s.parent==='S117'?'Draft':'Completed')+kv('Channel',s.parent==='S117'?'Email':'WhatsApp')+kv('Scheduled','18 Sep, 11:00 am IST')+kv('Audience','Eligible subscribers')+'<div class="stack">'+go(s.parent==='S117'?'S115':'S043','Edit campaign')+go(s.parent==='S117'?'S117-1':'S042-1',s.parent==='S117'?'Pause campaign':'Recipient log')+'</div>')+panel('Content',previewMessage(s));

case'inbox':return `<div class="toolbar"><button class="soft" data-filter>Needs reply</button><button data-filter>All</button><button data-filter>Mine</button><button data-filter>Unassigned</button></div>`+inbox(s);
case'chat':return `${go(s.parent==='S079'?'S078':'S027','← Back to inbox','textbtn')}<div style="margin:10px 0">${badge('Reply window open','green')} ${badge('Human','blue')}</div>`+inbox(s);
case'restricted':return `<div class="alert"><div><strong>${s.variant==='Window closed'?'Use an approved template':s.variant==='Send failed'?'Delivery failed':'Contact opted out'}</strong><p>${esc(s.sub)}</p></div></div>`+panel('Recent conversation',`<div class="bubble">${s.variant==='Main view'?'STOP':'Could you share the details?'}<div class="msgtime">Last received message</div></div><label class="small" for="blocked">Reply</label><textarea id="blocked" disabled style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font:inherit" placeholder="${s.variant==='Main view'?'Messaging unavailable for this contact':'Review available messaging options'}"></textarea>${go(s.next||'S029',esc(s.action),'primary')}`);

case'templatepick':return panel('Approved templates',[['Order confirmation','Utility · English'],['Shipping update','Utility · English'],['Product information','Utility · English']].map(x=>`<div class="task"><div class="grow"><strong>${x[0]}</strong><p>${x[1]}</p></div>${go('S033-1','Choose','textbtn')}</div>`).join(''));
case'template':return stepbar(/S045|S093/.test(s.parent)?2:1)+`<div class="split"><form class="panel" data-demo-form>${fields(s)}${footer(s)}</form><div>${panel('Customer preview',previewMessage(s)+'<p class="small">Variable examples are for review. Verify the actual recipient preview before sending.</p>')}</div></div>`;
case'review':{let count=s.parent==='S073'?'3':s.parent==='S095'?'18':'180';return stepbar(3)+`<div class="grid">${panel('What will happen',kv('Audience',s.parent==='S073'?'Eligible missing notifications':s.parent==='S095'?'Corporate gifting list':'Engaged customers')+kv('Recipients',count)+kv('Excluded','Opted out, duplicate or ineligible')+kv('Timing',s.parent==='S073'?'After confirmation':'18 Sep, 11:00 am IST')+kv('Repeat','Never')+'<p class="small">Review eligibility again at execution. Preview actions never send a message.</p>')}${panel('Content preview',s.parent==='S095'?'<p>Hi Priya, I am Parth, founder of PROMUNCH. Would you like to explore our snacks for your gifting programme?</p><p class="small">Parth · parth@trypromunch.in</p>':previewMessage(s))}</div>`+panel('Final check',`<label class="stack"><input type="checkbox" style="width:20px;height:20px"> I have checked the audience, content and timing.</label>${footer(s)}`)}
case'audience':return stepbar(1)+metrics([['Available contacts','420','Selected list'],['Eligible','180','Current rules'],['Excluded','240','Consent or eligibility'],['Selected','180','Review before launch']])+panel('Choose an audience',`<div class="field"><label for="audience">Audience</label><select id="audience"><option>Engaged and eligible contacts</option><option>Eligible repeat customers</option><option>By segment</option><option>By tags</option></select></div>${kv('Marketing consent','Required')}${kv('Suppressed contacts','Excluded')}${kv('Already contacted / enrolled','Excluded where applicable')}<details><summary>Why contacts are excluded</summary><p>Imported phone numbers alone do not establish marketing eligibility. Existing consent, suppression and duplicate protection rules still apply.</p></details>${footer(s)}`);
case'import':return `<div class="split"><div class="panel"><h2>1. Choose a file</h2><div class="dropzone"><p>${s.parent==='S129'?'PNG or SVG wordmark':s.parent==='S064'?'Approved source document':'CSV with column headers'}</p><input type="file" aria-label="Choose a sample file"><p class="small">File stays in this design preview.</p></div><h2>2. Match columns</h2>${fields(s)}</div>${panel('3. Review before importing',kv('Valid sample rows','18')+kv('Need correction','2')+kv('Duplicates','0')+'<p>No marketing consent is added just because a contact is imported.</p>'+footer(s))}</div>`;
case'media':return panel('Attachment',`<div class="dropzone"><svg viewBox="0 0 320 160" aria-label="Sample attachment"><rect width="320" height="160" rx="12" fill="#f4f1ea"/><rect x="120" y="20" width="80" height="120" rx="8" fill="#af272f"/><text x="160" y="73" fill="white" text-anchor="middle" font-size="12">PROMUNCH</text><text x="160" y="100" fill="white" text-anchor="middle" font-size="10">Sample image</text></svg><p class="small">product-information.png · 240 KB</p><input type="file" aria-label="Choose attachment"></div>${fields(s)}${footer(s)}`);

case'health':return panel('Data sources',(s.parent==='S060'?[['Voice calls','Some records need review','Review','amber'],['Contact do-not-call flags','Partial update failure','Review','red']]:s.parent==='S026'?[['Orders','Last success 8 min ago','Current','green'],['Inventory','Last success 12 min ago','Current','green'],['Finance','Last success yesterday','Review freshness','amber']]:[['WhatsApp','Last message 2 min ago','Connected','green'],['Shopify','Last sync 8 min ago','Connected','green'],['Amazon','Inventory checked 12 min ago','Connected','green'],['Email','No current verification available','Unverified','amber']]).map(x=>`<div class="statusline"><div><strong>${x[0]}</strong><div class="small muted">${x[1]}</div></div>${badge(x[2],x[3])}</div>`).join('')+`<details><summary>Technical details</summary><p class="small">Per-source last successful activity, error details and configuration state belong here. Never infer healthy from the presence of old data.</p></details>`);
case'library':{let mail=/S118|S119/.test(s.parent),custom=s.id==='S057-1';let entries=mail?[['Welcome series','New subscriber','S120'],['Abandoned cart','Abandoned checkout','S120'],['Post-purchase','Order completed','S120']]:custom?[['Post-purchase follow-up','Order placed','S057-2']]:[['Order confirmation','Order placed','S050'],['COD confirmation','COD order placed','S051'],['Shipping update','Order fulfilled','S052'],['Abandoned-cart recovery','Checkout abandoned','S053'],['Voice rescue','Recovery eligibility','S054'],['Review request','Post-purchase delay','S055'],['Restock reminder','Purchase interval','S056']];return panel('Journeys',entries.map(([a,b,c])=>`<div class="task"><div class="grow"><strong>${a}</strong><p>${b}</p></div>${badge(mail?'Draft':'Active',mail?'amber':'green')}${go(c,'Open →','textbtn')}</div>`).join(''))}

case'email':return panel(s.id==='S115-1'?'Customer email preview':'Incoming email',`<div class="small muted">${s.id==='S115-1'?'PROMUNCH · hello@trypromunch.in':'Riya Shah · riya@example.com'}</div><hr style="border:0;border-top:1px solid #e5e0d6;margin:20px 0"><p style="color:#1a1714;line-height:1.7">${s.id==='S115-1'?'Discover PROMUNCH favourites and find your next snack.':'Hi team,<br><br>Could you share the latest update for my order #1048? I would appreciate your help.<br><br>Thanks,<br>Riya'}</p>`)+panel('Next step',`${go(s.id==='S115-1'?'S115':'S069',s.id==='S115-1'?'Back to editor':'Review drafted reply','primary')}${go('S071','Sender context','textbtn')}`);

case'history':return panel('Activity',`<div class="timeline">${(s.parent==='S131'?[['12 Sep, 11:40 am','Access updated','Actor: Workspace owner. Target: Team member.'],['Recorded metadata','Member access','Previous access: Member. New access: Admin.']]:s.parent==='S070'?[['Today, 10:44 am','Reply sent','The latest sent message, distinct from draft content.'],['Today, 10:43 am','Draft revised','Earlier revision retained for reference.']]:[['Today, 10:42 am','Customer sent a message','Question about order #1048.'],['10 Sep, 2:12 pm','Order #1048 placed','₹600 · COD confirmation required.'],['8 Sep, 11:30 am','Email delivered','Campaign: Weekly favourites.']]).map(x=>`<div class="event"><span class="small muted">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><details><summary class="small">View details</summary><p>${x[2]} Only recorded information is displayed.</p></details></div>`).join('')}</div>`);
case'order':return `<div class="stack" style="margin-bottom:20px">${badge('Notification delivered','green')}${badge('Customer confirmation needed','amber')}</div><div class="grid">${panel('Order details',kv('Customer','Riya Shah')+kv('Amount','₹600')+kv('Payment','Cash on delivery')+kv('Order placed','12 Sep, 10:20 am'))}${panel('Next action','<p>Check the customer response before confirming this COD order.</p>'+go('S074-1','Record customer confirmation','primary')+'<br>'+go('S028','Open conversation →','textbtn')+'<br>'+go('S074-2','Review cancellation action','textbtn'))}</div>`;
case'board':return `<div class="toolbar"><input class="search" aria-label="Search pipeline" placeholder="Search company or creator…">${go(s.parent==='S103'?'S103-1':'S084','List view')}<button data-filter>Follow-up due</button></div><div class="board">${['New inquiries','In conversation','Proposal'].map((t,i)=>`<section class="column"><h2>${t} <span class="muted">${i===0?'2':'1'}</span></h2>${[i===0?'City Hotel Group':i===1?'Bright Gifts':'Green Desk Co.',...(i===0?['North Hub']:[])].map(n=>`<button class="dealcard" data-go="${s.parent==='S080'?'S084-1':'S104'}"><strong>${s.parent==='S080'?'Ananya':n}</strong><p>${s.parent==='S080'?'Creator collaboration':'Corporate gifting'}</p><p><b>Next:</b> Share product information</p>${badge('Due 15 Sep','amber')}</button>`).join('')}</section>`).join('')}</div>`;

case'assistant':return (s.parent==='S122'?panel('What would you like to know?',`<div class="stack">${go('S123','What needs my attention?')}${go('S124','Show stock risks')}${go('S123','Summarise recent sales')}</div>`):panel('Answer',`<p>Three things need attention:</p><div class="task"><div class="grow"><strong>Order #1048 needs confirmation</strong><p>Check the customer response before release.</p></div>${go('S074','View','textbtn')}</div><div class="task"><div class="grow"><strong>Masala Mania is out of stock</strong><p>120 units are inbound.</p></div>${go('S021','View','textbtn')}</div><p class="small">Based on sample source records. Open a source to see the detail.</p>${go('S124-1','View supporting records','textbtn')}`))+`<div class="panel"><label for="ask">Ask Maya</label><textarea id="ask" class="search" style="width:100%;margin:10px 0;min-height:90px" placeholder="Ask about your workspace…"></textarea>${go('S123','Ask','primary')}<details><summary>Recent conversations</summary>${go('S123','What needs my attention?','textbtn')}</details></div>`;
case'keys':return panel('Service keys',[['OpenAI','Configured'],['Resend','Configured'],['Shopify','Configured']].map(x=>`<div class="statusline"><div><strong>${x[0]}</strong><div class="small muted">•••••••• · Value hidden</div></div>${go('S127-1','Rotate','textbtn')}</div>`).join('')+'<p class="small">Owner access required. Secrets remain masked.</p>');
case'brand':return `<div class="grid">${panel('Current wordmark',`<div class="dropzone"><img src="${LOGO}" alt="PROMUNCH current wordmark" style="width:240px"><p class="small">Keep original proportions. Do not crop.</p>${go('S129-1','Upload logo')}</div><div class="stack"><span style="height:40px;width:40px;background:#af272f;border-radius:6px"></span><span>Primary accent · #AF272F</span></div>`)}<form class="panel" data-demo-form>${fields(s)}${footer(s)}</form></div>`;
case'progress':return panel('Progress',[['Find companies','25 of 25 found'],['Find contact details','18 verified · 7 being checked'],['Prepare results','Will be ready after the current stage']].map((x,i)=>`<div class="step"><span class="n">${i<1?'✓':i+1}</span><div style="flex:1"><h3>${x[0]}</h3><p>${x[1]}</p><div class="ratio"><span style="width:${i===0?100:i===1?72:0}%"></span></div></div></div>`).join(''));
case'confirm':return `<div class="panel form"><p>${esc(s.sub)}</p>${fields(s)}<div class="alert"><strong>This is a design preview. Confirming does not change any live record.</strong></div><div class="formfoot">${go(s.parent,'Cancel')}${act(s.action,'primary')}</div></div>`;
case'loading':return `<div class="panel" aria-busy="true"><span class="muted">Loading…</span>${[90,70,85,60,90].map(w=>`<div class="line" style="width:${w}%"></div>`).join('')}</div>`;
case'state':return panel('',`<div class="blank"><div style="font-size:28px;color:#af272f">${/saved|unsubscribed|complete|sent|scheduled/i.test(s.title)?'✓':'○'}</div><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p>${s.next?go(s.next,esc(s.action),'primary'):act(s.action)}</div>`);
case'navigation':return `<div class="grid">${[['Daily work',[['S013','Home'],['S027','WhatsApp'],['S067','Support email'],['S072','Order confirmations']]],['Sales & CRM',[['S018','Amazon'],['S075','Shopify'],['S106','Contacts'],['S086','B2B leads'],['S103','Deals']]],['Marketing & tools',[['S113','Email campaigns'],['S041','WhatsApp campaigns'],['S049','Automations'],['S061','Growth tools'],['S122','Ask Maya']]],['Administration',[['S125','Connections'],['S063','Knowledge base'],['S130','Team'],['S127','API keys'],['S129','Brand'],['S131','Audit log']]]].map(([t,links])=>panel(t,links.map(([id,l])=>go(id,l+' →','textbtn')+'<br>').join(''))).join('')}</div>`;
case'help':return panel('Choose a task',[['S027','Reply to a customer'],['S019','Check Amazon stock'],['S073','Review missing order notifications'],['S044','Prepare a WhatsApp campaign'],['S130','Invite a teammate']].map(([id,l])=>`<div class="task"><strong class="grow">${l}</strong>${go(id,'Show me','textbtn')}</div>`).join(''));
default:throw Error('Unmapped composition '+s.kind)
}}
function app(s,state='Ready'){let publicScreen=['S001','S002','S003','S004','S005','S011'].includes(s.parent);let body=state==='Ready'?content(s):state==='Loading'?content({...s,kind:'loading'}):state==='Empty'?panel('',`<div class="blank"><h2>Nothing here yet</h2><p>${s.kind==='inbox'?'No conversations match this view. Try another filter.':'No records match this view. Clear filters or return to the previous screen.'}</p><button data-reset>Clear filters</button></div>`):panel('',`<div class="blank"><h2>${state==='Error'?'We could not load this view':'You do not have access'}</h2><p>${state==='Error'?'Your last saved changes are safe. Try loading this view again.':'Ask your workspace administrator for the access needed for this task.'}</p><button data-reset class="primary">${state==='Error'?'Try again':'Back to workspace'}</button></div>`);if(s.kind==='auth'&&state==='Ready')return body;if(publicScreen)return '<div class="auth"><div class="authcard"><img src="'+LOGO+'" alt="PROMUNCH">'+body.replace('<h2>','<h1>').replace('</h2>','</h1>')+'</div></div>';let navGroups=[['Inbox',[['S027','WhatsApp'],['S067','Support email'],['S078','Instagram'],['S030','Tickets']]],['Sales & orders',[['S072','Order confirmations'],['S018','Amazon'],['S075','Shopify']]],['CRM',[['S106','Contacts'],['S086','B2B leads'],['S103','Deals']]],['Marketing',[['S113','Email campaigns'],['S041','WhatsApp campaigns'],['S038','Templates'],['S061','Growth tools']]],['Automations',[['S049','WhatsApp journeys'],['S118','Email automations'],['S058','Voice calls']]],['Reports',[['S015','Sales'],['S065','WhatsApp'],['S121','Email'],['S101','B2B outreach']]],['Settings',[['S125','Connections'],['S063','Knowledge base'],['S127','API keys'],['S128','Email sender'],['S129','Brand'],['S130','Team'],['S131','Audit log']]]];let activeGroup=s.module.includes('WhatsApp inbox')?'Inbox':s.module==='Amazon'||s.module==='Orders & Shopify'?'Sales & orders':s.module==='Contacts'||s.module==='B2B leads'||s.module==='Deals'?'CRM':s.module==='Instagram'||s.module==='Email support'?'Inbox':s.module==='WhatsApp marketing'||s.module==='Email marketing & automation'?'Marketing':s.module==='WhatsApp automation & knowledge'?'Automations':s.module==='Assistant & administration'?'Settings':'';let navMarkup=go('S013','Home',s.parent==='S013'?'active':'')+navGroups.map(([name,links])=>`<details ${activeGroup===name?'open':''}><summary>${name}</summary>${links.map(([id,label])=>go(id,label,s.parent===id?'active':'')).join('')}</details>`).join('');return `<div class="app"><aside class="sidenav"><img src="${LOGO}" alt="PROMUNCH">${navMarkup}<div class="account">${go('S122','Ask Maya','textbtn')}<br>${go('S006','My workspace','textbtn')}</div></aside><div class="content"><header class="topline"><span class="desktopcrumb">${esc(s.module)}</span><img class="mobilelogo" src="${LOGO}" alt="PROMUNCH"><div class="stack">${go('S008','Help','textbtn')}${go('S009','Alerts','textbtn')}</div></header><main class="page"><div class="head"><div><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p></div>${!['chat','form','auth','confirm','state','loading','template','emaildraft','review','import','flow','knowledge'].includes(s.kind)?`<div class="headact">${s.next?go(s.next,esc(s.action),'primary'):act(s.action)}</div>`:''}</div>${body}</main></div><nav class="mobilebar" aria-label="Main navigation">${[['S013','Home'],['S027','Inbox'],['S072','Orders'],['S007','More']].map(([id,l])=>go(id,l,s.parent===id?'current':'')).join('')}</nav></div>`}
const INNER_SCRIPT=`document.addEventListener('submit',e=>e.preventDefault());function send(x){parent.postMessage(x,'*')}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(b.dataset.go){send({go:b.dataset.go});return}if(b.hasAttribute('data-reset')){send({reset:true});return}if(b.hasAttribute('data-filter')){const el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modalbox" role="dialog" aria-modal="true" aria-label="Filters"><h2>Filters</h2><div class="field"><label for="filterstatus">Status</label><select id="filterstatus"><option>All</option><option>Ready</option><option>Pending</option><option>Failed</option></select></div><button class="primary" id="applyfilter">Apply filters</button> <button id="closefilter">Cancel</button></div>';document.body.appendChild(el);el.querySelector('select').focus();el.querySelector('#closefilter').onclick=()=>el.remove();el.querySelector('#applyfilter').onclick=()=>{const v=el.querySelector('select').value;document.querySelectorAll('[data-row]').forEach(r=>r.hidden=v!=='All'&&!r.textContent.includes(v));el.remove();toast('Filter applied to sample records.')};return}if(b.hasAttribute('data-audio')){b.textContent=b.textContent.includes('Play')?'❚❚ Pause sample':'▶ Play sample';toast('Illustrative player. No recording is loaded.');return}if(b.dataset.action){const text=b.dataset.action;if(/Send|Launch|Schedule|Remove|Delete|Disconnect|Confirm|Activate|Rotate/i.test(text)){const el=document.createElement('div');el.className='modalback';el.innerHTML='<div class="modalbox" role="dialog" aria-modal="true" aria-label="Review action"><h2>'+text.replace(/[<>]/g,'')+'</h2><p>This is a simulated design action. It will not contact anyone or change live data.</p><button class="primary" id="confirmdemo">Confirm preview</button> <button id="canceldemo">Cancel</button></div>';document.body.appendChild(el);el.querySelector('#canceldemo').onclick=()=>el.remove();el.querySelector('#confirmdemo').onclick=()=>{el.remove();toast('Preview confirmed. No live action was taken.')};el.querySelector('#canceldemo').focus()}else{toast(text+' · Preview complete. No live data changed.')}}});function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),4000)}document.addEventListener('change',e=>{if(e.target.hasAttribute('data-route'))send({go:e.target.value})});document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA'&&document.querySelector('[data-live-preview]')){document.querySelector('[data-live-preview]').textContent=e.target.value.replaceAll('{{1}}','Riya').replaceAll('{{2}}','1048').replaceAll('{{first_name}}','Priya')}if(e.target.classList.contains('search')){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-row]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q))}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.modalback')?.remove()});`;
function render(){const s=SCREENS.find(x=>x.id===selected)||SCREENS[0];selected=s.id;location.hash=selected;$('screenTitle').textContent=s.title;$('screenMeta').textContent=s.module+' · '+s.variant+' · '+s.id;$('designNote').textContent=s.plan+' Mobile: '+s.mobile;$('source').textContent='Source surface: '+s.name+' · '+s.source;$('preview').srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(s.title)+'</title><style>'+APP_CSS+'</style></head><body class="'+(s.kind==='chat'?'focus-chat':s.kind==='amazon'?'amazon-page':'')+'">'+app(s,$('state').value)+'<script>'+INNER_SCRIPT+'<\/script></body></html>';$('approved').checked=!!approved[selected+'-'+device];$('feedback').value=notes[selected+'-'+device]||'';fit();catalog();$('progress').textContent=Object.values(approved).filter(Boolean).length+' of '+SCREENS.length*2+' laptop/mobile layouts approved'}
function fit(){const w=device==='mobile'?390:1240,h=device==='mobile'?844:900;const available=document.querySelector('.stage').clientWidth-(innerWidth<950?24:44),scale=Math.min(1,available/w);$('preview').style.width=w+'px';$('preview').style.height=h+'px';$('preview').style.transform='scale('+scale+')';$('framebox').style.width=w*scale+'px';$('framebox').style.height=h*scale+'px'}
function filtered(){const q=$('find').value.toLowerCase(),m=$('module').value;return SCREENS.filter(s=>(!m||s.module===m)&&(!q||(s.title+' '+s.name+' '+s.variant+' '+s.module).toLowerCase().includes(q)))}
function catalog(){const a=filtered();$('catalog').innerHTML=a.map(s=>`<button class="${s.id===selected?'selected':''}" data-id="${s.id}">${esc(s.title)}<small>${esc(s.variant)} · ${s.id}</small></button>`).join('');$('screenSelect').innerHTML=a.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.title)} · ${esc(s.variant)}</option>`).join('')}
$('count').textContent=SCREENS.length+' screen designs';$('module').innerHTML='<option value="">All areas</option>'+[...new Set(SCREENS.map(s=>s.module))].map(m=>`<option>${esc(m)}</option>`).join('');$('catalog').onclick=e=>{let b=e.target.closest('button');if(b){selected=b.dataset.id;$('state').value='Ready';render()}};$('find').oninput=catalog;$('module').onchange=catalog;$('screenSelect').onchange=e=>{selected=e.target.value;$('state').value='Ready';render()};$('state').onchange=render;['laptop','mobile'].forEach(x=>$(x).onclick=()=>{device=x;['laptop','mobile'].forEach(d=>$(d).classList.toggle('on',x===d));render()});['previous','next'].forEach((id,i)=>$(id).onclick=()=>{let a=filtered(),idx=a.findIndex(s=>s.id===selected);selected=a[(idx+(i?1:-1)+a.length)%a.length]?.id||selected;$('state').value='Ready';render()});$('approved').onchange=e=>{approved[selected+'-'+device]=e.target.checked;try{localStorage.setItem('pm-design-approved',JSON.stringify(approved))}catch{}render()};$('feedback').oninput=e=>{notes[selected+'-'+device]=e.target.value;try{localStorage.setItem('pm-design-notes',JSON.stringify(notes))}catch{}};$('export').onclick=()=>{const b=new Blob([JSON.stringify({date:new Date().toISOString(),approved,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='PROMUNCH-design-feedback.json';a.click();URL.revokeObjectURL(a.href)};addEventListener('message',e=>{if(e.source!==$('preview').contentWindow)return;if(e.data.go&&SCREENS.some(s=>s.id===e.data.go)){selected=e.data.go;$('state').value='Ready';render()}if(e.data.reset){$('state').value='Ready';render()}});addEventListener('resize',fit);window.setPreview=(id,d='laptop',state='Ready')=>{selected=id;device=d;$('state').value=state;render()};render();
</script></body></html>
