ding:0}.note{font-size:10px}#type-note{display:none}}</style><header><h1 style="display:flex;gap:10px;align-items:center"><img src="assets/promunch-logo.png" alt="PROMUNCH logo" width="48" height="24">PROMUNCH / Design review</h1><label>Screen <select id="screen" aria-label="Screen"></select></label><div><button id="desktop" class="on">Desktop</button> <button id="mobile">Mobile 390</button> <button id="small">Mobile 360</button></div><label>Style <select id="design" aria-label="Design direction"><option value="soft">Soft depth</option><option value="bold">Bold brand</option><option value="compact">Compact utility</option></select></label><label>Typography <select id="typography" aria-label="Typography direction"><option value="modern">Modern · Avenir</option><option value="system">Clean · System</option><option value="editorial">Editorial · Georgia</option></select></label><span id="type-note"></span><a href="app.html?v=funnel24" id="full-app" target="_blank">Open full app ↗</a><label>State <select id="state"><option value="normal">Normal</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="error">Error</option><option value="stale">Stale data</option><option value="denied">No permission</option></select></label><span id="context"></span><a href="coverage.html" target="_blank">Page & flow checklist</a></header><div class="note">Interactive design prototype · Illustrative data only · Actions stay in this browser · Review controls above are not part of the product.</div><div id="stage"><iframe id="frame" title="PROMUNCH redesigned application"></iframe></div><script src="screens.js?v=funnel24"></script><script>const sel=document.querySelector('#screen'),frame=document.querySelector('#frame');for(const group of [...new Set(SCREENS.map(x=>x.group))]){let g=document.createElement('optgroup');g.label=group;SCREENS.filter(x=>x.group===group).forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=s.title;g.append(o)});sel.append(g)}function applyTypography(){const font=document.querySelector('#typography').value;localStorage.setItem('pm-preview-font',font);const url=new URL(location.href);url.searchParams.set('font',font);history.replaceState(null,'',url);document.querySelector('#type-note').textContent=({modern:'Rounded, confident headings',system:'Crisp, familiar, highly readable',editorial:'Expressive serif headings'})[font];if(frame.contentDocument)frame.contentDocument.documentElement.dataset.typography=font;document.querySelector('#full-app').href='app.html?v=funnel24&font='+font+location.hash;}frame.addEventListener('load',applyTypography);function load(){const route=new URLSearchParams(location.hash.split('?')[1]||'');route.set('state',document.querySelector('#state').value);route.set('design',document.querySelector('#design').value);frame.src='app.html?v=funnel24#'+sel.value+'?'+route;document.querySelector('#context').textContent=SCREENS.length+' designed screens';history.replaceState(null,'','#'+sel.value+'?'+route)}const initial=new URLSearchParams(location.search);const font=initial.get('font')||localStorage.getItem('pm-preview-font')||'modern';document.querySelector('#typography').value=['modern','system','editorial'].includes(font)?font:'modern';document.querySelector('#typography').onchange=applyTypography;document.querySelector('#design').value=initial.get('design')||'bold';sel.value=SCREENS.some(s=>s.id===location.hash.slice(1).split('?')[0])?location.hash.slice(1).split('?')[0]:'home';document.querySelector('#design').onchange=load;sel.onchange=()=>{history.replaceState(null,'','#'+sel.value);load()};document.querySelector('#state').onchange=load;['desktop','mobile','small'].forEach(id=>document.querySelector('#'+id).onclick=()=>{frame.className=id==='desktop'?'':id==='small'?'mobile small':'mobile';document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',b.id===id))});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1).split('?')[0];if(SCREENS.some(s=>s.id===id)){sel.value=id;load()}});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||!SCREENS.some(s=>s.id===e.data.screen))return;sel.value=e.data.screen;history.replaceState(null,'','#'+(e.data.route||sel.value));applyTypography()});load();</script></html>
