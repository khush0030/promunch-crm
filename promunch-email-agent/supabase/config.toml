# Supabase local development config.
# Edge function specifics — most options here only matter for `supabase functions serve`.

project_id = "promunch-email-agent"

[functions.gmail-webhook]
verify_jwt = false                    # Pub/Sub doesn't send a Supabase JWT

[functions.gmail-poll]
verify_jwt = false                    # invoked by scheduled cron

[functions.gmail-watch-renew]
verify_jwt = false                    # invoked by scheduled cron

[functions.slack-events]
verify_jwt = false                    # Slack uses its own signing-secret check

[functions.slack-interactivity]
verify_jwt = false                    # Slack uses its own signing-secret check

[functions.oauth-callback]
verify_jwt = false                    # gated by SETUP_TOKEN query param instead

[functions.backfill-brand]
verify_jwt = false                    # gated by SETUP_TOKEN query param instead


[functions.nudge-pending]
verify_jwt = false                    # invoked by pg_cron

[functions.shopify-webhook]
verify_jwt = false                    # Shopify uses HMAC header

[functions.shopify-daily-summary]
verify_jwt = false                    # invoked by pg_cron at 18:29 UTC

[functions.shopify-status]
verify_jwt = false                    # Shopify uses HMAC header

[functions.shopify-slash]
verify_jwt = false                    # Slack signing-secret check

[functions.shopify-orders-backfill]
verify_jwt = false                    # gated by SHOPIFY_BACKFILL_TOKEN query param

[functions.shopify-contacts-backfill]
verify_jwt = false                    # gated by SHOPIFY_BACKFILL_TOKEN query param

[functions.shopify-relink]
verify_jwt = false                    # gated by SHOPIFY_BACKFILL_TOKEN query param

[functions.shopify-creator-backfill]
verify_jwt = false                    # gated by SHOPIFY_BACKFILL_TOKEN query param

[functions.shopify-catalog-sync]
verify_jwt = false                    # called server-side with the service key by /api/shopify/catalog; gated by requireInternal

[functions.shopify-consent-set]
verify_jwt = false                    # self-auths via requireInternal (service-role bearer)

[functions.shopify-stats]
verify_jwt = true                     # called server-side with the anon key by /api/shopify/stats

[functions.wa-webhook]
verify_jwt = false                    # Meta verifies via X-Hub-Signature-256

[functions.wa-send]
verify_jwt = false                    # called function-to-function; gateway JWT check broke post-upgrade

[functions.wa-ai-reply]
verify_jwt = false                    # invoked by wa-webhook / wa-jobs-tick function-to-function

[functions.kb-ingest]
verify_jwt = true                     # NOT authorization (the public anon key passes); real auth is requireInternal

[functions.kb-embed]
verify_jwt = true                     # NOT authorization (the public anon key passes); real auth is requireInternal

[functions.wa-campaign-send]
verify_jwt = false                    # self-chains function-to-function; gateway JWT check broke post-upgrade

[functions.wa-register]
verify_jwt = true                     # one-shot Cloud API number registration; gated by requireInternal

[functions.wa-template-create]
verify_jwt = true                     # NOT authorization (the public anon key passes); real auth is requireInternal

[functions.shopify-wa]
verify_jwt = false                    # Shopify uses HMAC header

[functions.wa-journey-tick]
verify_jwt = false                    # invoked by scheduled cron

[functions.wa-confirmation-sweep]
verify_jwt = false                    # invoked by scheduled cron with service-role bearer; gated by requireInternal

[functions.wa-jobs-tick]
verify_jwt = false                    # invoked by scheduled cron

[functions.wa-health]
verify_jwt = false                    # invoked by scheduled cron

[functions.wa-watchdog]
verify_jwt = false                    # invoked by pg_cron (dead-man's-switch) with service-role bearer; gated by requireInternal

[functions.wa-rfm-tick]
verify_jwt = false                    # invoked by scheduled cron (nightly RFM tag refresh)

[functions.wa-campaign-report]
verify_jwt = false                    # invoked by wa-campaign-send / wa-jobs-tick with service-role bearer; gated by requireInternal

[functions.wa-weekly-summary]
verify_jwt = false                    # invoked by pg_cron (Mon 09:00 IST); posts WhatsApp recap to Slack

[functions.wa-ticket-watchdog]
verify_jwt = false                    # invoked by pg_cron: re-pings unowned tickets past SLA + daily digest

[functions.wa-meta-info]
verify_jwt = false                    # read-only Graph diagnostic (tier/quality); gated by requireInternal

[functions.wa-campaign-worker]
verify_jwt = false                    # invoked by pg_cron every ~2 min; promotes scheduled + drives/heals sending campaigns

[functions.cod-gate-action]
verify_jwt = false                    # called by Next.js API with service role bearer; gated by requireInternal

[functions.amazon-poll]
verify_jwt = false                    # invoked by scheduled cron (SP-API sync)

[functions.ig-webhook]
verify_jwt = false                    # Meta verifies via X-Hub-Signature-256

[functions.ig-send]
verify_jwt = false                    # called function-to-function with the service key

[functions.ig-ai-reply]
verify_jwt = false                    # invoked by ig-webhook / ig-jobs-tick function-to-function

[functions.ig-jobs-tick]
verify_jwt = false                    # invoked by scheduled cron with service-role bearer; gated by requireInternal

[functions.ig-analyze]
verify_jwt = false                    # called function-to-function by the Next dashboard route

[functions.ig-discovery]
verify_jwt = false                    # called by the Next dashboard route + ig-discovery-tick; gated by requireInternal

[functions.ig-discovery-tick]
verify_jwt = false                    # invoked by pg_cron (*/5) with service-role bearer; gated by requireInternal

[functions.ig-followup-tick]
verify_jwt = false                    # invoked by pg_cron (*/15) with service-role bearer; gated by requireInternal

[functions.deal-scan]
verify_jwt = false                    # pg_cron + dashboard invoke with service-role bearer; gated by requireInternal

[functions.b2b-send]
verify_jwt = false                    # self-auths via requireInternal (service-role bearer)
